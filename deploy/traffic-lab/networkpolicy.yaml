# Traffic-lab pods may reach only the lab target namespace (any TCP port, so the
# port_scan scenario gets real open/closed answers instead of silent drops), the
# decoys in ids-deception, and cluster DNS. Any other egress is dropped, so the
# generator cannot reach anything outside the lab.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traffic-lab-egress
  namespace: ids-traffic
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: target-apps
      ports:
        - {protocol: TCP, port: 1, endPort: 65535}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ids-deception
          podSelector:
            matchLabels:
              app.kubernetes.io/component: decoy
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
